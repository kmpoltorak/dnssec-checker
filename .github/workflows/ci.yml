name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./cmd/dnssec-checker
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build -t dnssec-checker:ci .
      - name: Smoke test
        run: |
          docker run -d --name web -p 127.0.0.1:8080:8080 dnssec-checker:ci
          for i in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q "DNSSEC checker"
          curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/api/check?domain=http://bad" | grep -qx 400
          docker rm -f web
